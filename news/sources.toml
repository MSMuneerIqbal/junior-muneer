# Official news sources for the news agents (PLAN.md section 6.4). ONLY these are read.
# You can add or remove sources. A broken entry stops the backend from starting, with a clear message.
#
# Each source:
#   name      shown in the digest ("OpenAI says ...")
#   topic     "ai" or "pakistan"
#   kind      "rss"    an RSS or Atom feed
#             "page"   a news page; links starting with `link_prefix` are the articles, and each
#                      article's date and title come from the article page (or the link text)
#             "trends" Google Trends' trending searches feed
#   url       the feed or page address (https)
# Optional:
#   domains     other sites its articles may live on (the url's own site is always allowed);
#               links anywhere else are dropped, and redirects anywhere else are refused
#   link_prefix for "page": the path articles start with, e.g. "/news/"
#   keywords    only keep items that mention one of these words (for broad company feeds)
#   max_items   how many of the newest items to keep (default 30)
#
# All addresses below were checked on 2026-10-15. Not readable then (so not listed):
#   xAI (x.ai blocks automated readers and has no feed), Qwen (qwen.ai is app-only; its old
#   GitHub blog stopped in 2025), LMArena's leaderboard (blocks automated readers; its blog is
#   below), The News (its feeds stopped updating in 2025).
# [search] lists extra official sites web search may use (for questions a digest doesn't cover).
# Rankings ("who's on top") come from the Artificial Analysis API when ARTIFICIAL_ANALYSIS_API_KEY
# is set in backend/.env (free key: artificialanalysis.ai).

# Web search for things a digest doesn't cover may only search these sites, plus every source's own site.
[search]
ai = ["x.ai", "qwen.ai", "lmarena.ai", "artificialanalysis.ai", "anthropic.com", "openai.com", "deepseek.com"]
pakistan = ["pbs.gov.pk", "sbp.org.pk", "pta.gov.pk", "fbr.gov.pk"]

