# Model router: which OpenAI model each agent uses.
# Edit this file to change a model. No code changes needed; the backend
# picks up changes on the next message. A mistake here shows a clear error.

# Tiers. Agent files say "strong" or "small"; this decides what that means.
[tiers]
strong = "gpt-6.1-sol"   # Junior Muneer and the writers
small = "gpt-6-luna"     # routine steps: titles, summaries, sorting

# Per-agent overrides (optional). The value is a tier name or an exact model.
# Example:  checker = "small"   or   writer = "gpt-6-astra"
[agents]
summarizer = "small"

# Prices in US dollars per 1 million tokens, from OpenAI's pricing page
# (checked 2026-10-14). Every model used above needs a price, so the daily
# cost cap can't be skipped by mistake.
[prices."gpt-6-astra"]
input = 10.00
cached_input = 1.00
output = 50.00

[prices."gpt-6.1-sol"]
input = 2.00
cached_input = 0.10
output = 10.00

[prices."gpt-6-sol"]
input = 2.00
cached_input = 0.20
output = 10.00

[prices."gpt-6-luna"]
input = 0.10
cached_input = 0.01
output = 0.50

# Voice (phase 1). Prices from OpenAI's pricing page (checked 2026-10-15).
[audio]
transcribe = "gpt-4o-transcribe"      # your voice messages -> text (best for Urdu, see PLAN.md)
speech = "gpt-4o-mini-tts"            # his answers read aloud
realtime = "gpt-realtime-2.1"         # live calls: "Natural" quality (Settings)
realtime_economy = "gpt-realtime-2.1-mini"  # live calls: "Economy" quality
gemini_transcribe = "gemini-2.5-flash"         # voice messages with Gemini (Settings -> Voice): keeps English as English
gemini_speech = "gemini-2.5-flash-preview-tts" # his answers read aloud by Gemini, in the Gemini voice

# Per minute of audio (speech-to-text).
[audio_prices."gpt-transcribe"]
per_minute = 0.0045

[audio_prices."gpt-4o-transcribe"]
per_minute = 0.006

[audio_prices."gpt-4o-mini-transcribe"]
per_minute = 0.003

# Text-to-speech: about $0.015 per minute of speech ($12 per 1M audio tokens).
[audio_prices."gpt-4o-mini-tts"]
per_minute = 0.015

# Gemini voice messages (free tier on a free key). Audio is 25 tokens a second: 2.5 Flash hears at $1.00 per 1M
# audio tokens (~$0.0015/min); the speech model speaks at $10 per 1M audio tokens (~$0.015/min).
[audio_prices."gemini-2.5-flash"]
per_minute = 0.0015

[audio_prices."gemini-2.5-flash-preview-tts"]
per_minute = 0.015

# Other models you can pick in Settings -> Voice (ai.google.dev/gemini-api/docs/pricing, checked 2026-10-20).
[audio_prices."gemini-3.8-flash"]        # hears at $3.00 per 1M audio tokens
per_minute = 0.005

[audio_prices."gemini-3.1-flash-lite"]   # hears at $0.50 per 1M audio tokens
per_minute = 0.00075

[audio_prices."gemini-2.5-pro-preview-tts"]  # speaks at $20 per 1M audio tokens; paid keys only
per_minute = 0.03

[audio_prices."tts-1"]
per_minute = 0.0135   # $15 per 1M characters, ~900 characters per minute

# Live calls, per 1M tokens.
[audio_prices."gpt-realtime-2.1-mini"]
audio_input = 10.00
audio_cached_input = 0.30
audio_output = 20.00
text_input = 0.60
text_cached_input = 0.06
text_output = 2.40

[audio_prices."gpt-realtime-2.1"]
audio_input = 32.00
audio_cached_input = 0.40
audio_output = 64.00
text_input = 4.00
text_cached_input = 0.40
text_output = 24.00

# Live calls with Google Gemini Live (Settings → Live calls → Voice engine), per 1M tokens.
# From ai.google.dev/gemini-api/docs/pricing (checked 2026-10-20). Google Search in Gemini 3 calls:
# 5,000 free a month, then $14 per 1,000 (not counted here).
[audio_prices."gemini-3.8-live"]
audio_input = 3.00
audio_output = 12.00
text_input = 0.75
text_output = 4.50

[audio_prices."gemini-2.5-flash-native-audio-preview-12-2025"]
audio_input = 3.00
audio_output = 12.00
text_input = 0.50
text_output = 2.00   # not listed separately; the audio models' text output is small

# Other providers for chat (Settings → Models). Voice messages stay on OpenAI.
# A model from a provider is written "provider:model", e.g. "deepseek:deepseek-flash".
# Choose them in Settings -> Models, or here in [tiers] / [agents].
[providers.deepseek]
label = "DeepSeek"
base_url = "https://api.deepseek.com"
key_env = "DEEPSEEK_API_KEY"

# "deepseek-flash" is DeepSeek-V4.1-Flash-1017 (vision too) since 2026-10-17; prices unchanged (checked 2026-10-19).
# DeepSeek prices (checked 2026-10-15). They are cheaper off-peak; the peak price
# is used here so the daily cap is never under-counted.
[prices."deepseek:deepseek-flash"]
input = 0.30
cached_input = 0.006
output = 1.20

[prices."deepseek:deepseek-v4-pro"]
input = 1.32
cached_input = 0.044
output = 3.96

# Google Gemini through Google's OpenAI-compatible endpoint (ai.google.dev/gemini-api/docs/openai), with GEMINI_API_KEY.
# Paid-tier prices (checked 2026-10-20); with a free-tier key the Flash models cost nothing within Google's limits,
# but the paid price is counted here so the daily cap is never under-counted.
[providers.gemini]
label = "Gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai/"
key_env = "GEMINI_API_KEY"

[prices."gemini:gemini-3.8-flash"]
input = 0.75
cached_input = 0.075
output = 3.75

[prices."gemini:gemini-3.1-flash-lite"]
input = 0.25
cached_input = 0.025
output = 1.50

[prices."gemini:gemini-2.5-flash"]   # also Gemini web search (free Google Search on the free tier)
input = 0.30
cached_input = 0.03
output = 2.50

[prices."gemini:gemini-4-argon"]   # $4 / $20 from 2026-12-01; no free tier
input = 2.00
cached_input = 0.10
output = 10.00

# Tools, in US dollars per call.
[tool_prices]
web_search = 0.010
# DeepSeek's own Search API (api-docs.deepseek.com/guides/search): $0.75 per 1,000 searches (checked 2026-10-19).
deepseek_search = 0.00075
# Gemini web search runs on Gemini 2.5 Flash: Google Search is free on the free tier (1,500 a day; paid: $35 per
# 1,000 above that). Counted as free here; Activity shows how many searches ran.
gemini_search = 0.0
